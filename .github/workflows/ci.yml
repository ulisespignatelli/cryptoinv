name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Formato y vet
        run: make lint
      - name: Tests
        run: make test-go

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: El contrato y los tipos generados coinciden
        run: |
          cd web && npm ci && npm run gen:api
          git diff --exit-code src/shared/api/schema.gen.ts
      - name: Tipos y tests
        run: make test-web

  # Binario completo (panel embebido) y escaneo del propio repositorio.
  build:
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - name: Escaneo criptográfico
        run: |
          ./bin/cryptoinv scan . --asset cryptoinv --skip-tests --format sarif --output results.sarif
          ./bin/cryptoinv scan . --asset cryptoinv --skip-tests --format cbom --output cbom.json
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: cryptoinv
      - uses: actions/upload-artifact@v4
        with:
          name: cryptoinv-linux-amd64
          path: |
            bin/cryptoinv
            cbom.json
